source = ~/.config/hypr/themes/cyber.conf

monitor = eDP-1,1920x1080@60,0x0,1.5

$terminal = kitty
$launcher = wofi --show drun
$fileManager = nautilus

general {
    gaps_in = 6
    gaps_out = 18
    border_size = 2

    col.active_border = $cyan $violet 45deg
    col.inactive_border = $muted

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 12

    active_opacity = 0.75
    inactive_opacity = 0.60

    shadow {
        enabled = true
        range = 10
        render_power = 3
    }

    blur {
        enabled = true
        size = 4
        passes = 2
        vibrancy = 0.15
        new_optimizations = true
    }
}

animations {
    enabled = yes

    bezier = smooth,0.16,1,0.3,1
    bezier = snappy,0.2,0.8,0.2,1

    animation = windows,1,5,smooth,popin
    animation = windowsIn,1,5,smooth,popin
    animation = windowsOut,1,4,snappy,popin
    animation = border,1,5,smooth
    animation = fade,1,5,smooth
    animation = workspaces,1,5,smooth,slide
    animation = layers,1,5,smooth
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vrr = 0
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

gestures {
}

# Terminal
bind = SUPER, RETURN, exec, $terminal

# Launcher
bind = SUPER, SPACE, exec, $launcher

# File manager
bind = SUPER, E, exec, $fileManager

# Close window
bind = SUPER, Q, killactive

# Toggle floating

# Fullscreen
bind = SUPER, F, fullscreen

# Reload
bind = SUPER SHIFT, R, exec, hyprctl reload

# Exit Hyprland

# Focus movement
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

# Move windows
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move window to workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Mouse window control
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Screenshots
bind = , PRINT, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Wallpaper
exec-once = hyprpaper -c ~/.config/hypr/hyprpaper.conf

# Bar
exec-once = waybar

# Notifications
exec-once = mako

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = SUPER, V, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Floating

# ==========================================
# CYBERPUNK DESKTOP CONTROLS
# ==========================================

# Clipboard
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Floating
bind = SUPER SHIFT, SPACE, togglefloating

# F1 = Mute
bind = , F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# F2 = Volume down
bind = , F2, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# F3 = Volume up
bind = , F3, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# F4 = Microphone toggle
bind = , F4, exec, ~/.config/hypr/scripts/mic-toggle.sh

# F5 = Brightness down
bind = , F5, exec, ~/.config/hypr/scripts/brightness-down.sh

# F6 = Brightness up
bind = , F6, exec, ~/.config/hypr/scripts/brightness-up.sh

# F8 = Airplane mode
bind = , F8, exec, ~/.config/hypr/scripts/airplane.sh

# Bluetooth
bind = SUPER, B, exec, ~/.config/hypr/scripts/bluetooth.sh

# Wi-Fi
bind = SUPER, W, exec, ~/.config/hypr/scripts/wifi.sh

# Audio mixer
bind = SUPER, A, exec, pavucontrol

# Screenshot
bind = SUPER SHIFT, S, exec, ~/.config/hypr/scripts/screenshot.sh

# Lock
bind = SUPER, L, exec, hyprlock

# Power menu
bind = SUPER SHIFT, P, exec, ~/.config/hypr/scripts/power.sh
bind = SUPER SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-next.sh

# Reference-inspired window/layer rules. They affect presentation only and
# deliberately do not alter any custom shortcuts, monitor settings, or scripts.
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = float, title:^(Open File|Save File)$
layerrule = blur, wofi
layerrule = ignorealpha 0.15, wofi
