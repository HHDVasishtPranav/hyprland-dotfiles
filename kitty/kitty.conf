# ==============================
# Kitty - Modern Dark Setup
# ==============================

# Font
font_family      JetBrains Mono
font_size        12.5

# Let Kitty pass the current directory and window title to supported shells.
# Inspired by the reference setup; no prompt or keybinding changes.
shell_integration enabled

# Cursor
cursor_shape     beam
cursor_blink_interval 0.6
cursor_stop_blinking_after 15

# Window
window_padding_width 12
window_padding_height 10
hide_window_decorations yes

# Transparency
background_opacity 0.88
dynamic_background_opacity yes

# Blur (works with compositor such as Hyprland)
background_blur 8

# ==============================
# Colors
# ==============================

foreground       #D8DEE9
background       #0B0F14

selection_foreground #0B0F14
selection_background #88C0D0

cursor           #D8DEE9

# Black
color0           #191D24
color8           #4C566A

# Red
color1           #BF616A
color9           #D57780

# Green
color2           #A3BE8C
color10          #B1D196

# Yellow
color3           #EBCB8B
color11          #F0DFAF

# Blue
color4           #81A1C1
color12          #8FBCBB

# Magenta
color5           #B48EAD
color13          #C49AC0

# Cyan
color6           #88C0D0
color14          #8FBCBB

# White
color7           #D8DEE9
color15          #ECEFF4

# Optional wallpaper-derived palette. This static starter is kept in sync
# with the cyber/Nord colors above until Matugen is installed and run.
include dynamic-theme.conf

# ==============================
# Tabs
# ==============================

tab_bar_edge     bottom
tab_bar_style    powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_foreground   #ECEFF4
active_tab_background   #2E3440
inactive_tab_foreground #7B8494
inactive_tab_background #191D24

# ==============================
# Scrollback
# ==============================

scrollback_lines 10000

# ==============================
# Mouse
# ==============================

copy_on_select yes
strip_trailing_spaces smart

# ==============================
# Useful shortcuts
# ==============================

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Increase/decrease font
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace restore_font_size

# Transparency
map ctrl+shift+] set_background_opacity +0.05
map ctrl+shift+[ set_background_opacity -0.05
